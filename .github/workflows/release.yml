name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Lother/dalamud-tc-pin/releases/download/v12.0.2/dalamud-api12-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:DALAMUD_HOME"
        env:
          DALAMUD_HOME: ${{ github.workspace }}\dalamud
      - name: Build with dotnet
        run: dotnet build --configuration Release Saucy/Saucy.csproj
        env:
          DALAMUD_HOME: ${{ github.workspace }}\dalamud
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            Saucy/bin/**/Saucy/latest.zip
            Saucy/bin/**/Saucy/Saucy.json
          generate_release_notes: true
