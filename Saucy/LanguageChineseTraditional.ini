Cancels a background deck build after this long. If the build is not finished by deck select, Saucy falls back to your best profile deck. Map navigation waits until a deck is ready.==超過此時間後將取消背景卡組建構。若在選擇卡組時仍未完成建構，Saucy 會改用你最佳的設定檔卡組。地圖導航會等待卡組準備完成後才會開始。
