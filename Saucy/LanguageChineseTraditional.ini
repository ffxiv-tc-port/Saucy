Picks a deck at deck select. Default: highest opening win % among your profile decks.==在選擇卡組時自動挑選卡組。預設：選擇你設定檔卡組中開局勝率最高的一副。
Use cached deck if available==若有快取卡組則使用快取卡組
At match prep, loads a matching cached deck into profile slot 5 when one exists for this NPC and rules. Auto-pick still sims your profile decks and picks the highest opening win %. Cannot be combined with Build optimized deck.==在準備對戰時，若此 NPC 與規則存在符合的快取卡組，會將其載入設定檔卡組槽 5。自動選擇仍會模擬你的設定檔卡組並挑選開局勝率最高者。無法與「建構最佳化卡組」同時使用。
Build optimized deck==建構最佳化卡組
At match prep, builds a deck from your owned cards when no valid cache or existing "NPC (Saucy)" profile deck fits this NPC and rules.==在準備對戰時，若沒有符合此 NPC 與規則的有效快取或現有「NPC (Saucy)」設定檔卡組，會使用你擁有的卡片建構卡組。
Rebuilds if you have gained ?? or more new cards since the last build for that NPC.==若自上次為該 NPC 建構卡組以來已獲得 ?? 張以上新卡，則會重新建構。
Saves to profile slot 5 and selects it. Cannot be combined with Use cached deck.==會儲存至設定檔卡組槽 5 並自動選擇。無法與「使用快取卡組」同時使用。
