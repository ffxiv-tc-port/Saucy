\n\nLinux / Wine (XLCore, Steam Deck): deck builds are capped to half your logical cores no matter what you pick here. Using every core for parallel deck builds can hard-crash the game under Wine.==\n\nLinux / Wine（XLCore、Steam Deck）：無論此處如何設定，卡組建構都會限制為邏輯核心數的一半。在 Wine 下使用全部核心進行平行卡組建構可能導致遊戲直接崩潰。
