Only runs when you press Go on the Mini Cactpot row of the Navigation panel and the walk reaches the broker.\nIt talks to the broker and picks the join option, nothing more. The broker's dialog and the purchase confirmation (10 MGP a ticket) must be handled by YesAlready or by you; Saucy never presses them.\nThis module then reveals, picks a line and collects; later tickets follow "auto-buy the next ticket" as before.\nWhile picking the join option it asks YesAlready to pause its list selection for a few seconds, so the two never pick at the same time.\nIf today's tickets are already known to be used up, it does not talk and prints one line instead. If no ticket opens within 30 seconds, it stops and says why.\nOther dialogs, NPCs and destinations are never touched. Stop it any time with Stop on the Navigation panel.==只在你按下「導航」頁仙人微彩那一列的「前往」、並走到發放員身邊時才會動作。\n只會跟發放員對話並選「參加」。發放員的對話與購票確認（每張 10 金碟幣）要由 YesAlready 或你自己處理，Saucy 不會按。\n接著由本模組翻格、選線與領獎；之後的每一張照舊由「自動購買下一張」處理。\n選「參加」的那幾秒會請 YesAlready 暫停它的清單選項功能，免得兩邊同時選。\n已知今天的彩券用完時不會對話，只提示一行；30 秒內沒有開出彩券就停下並說明原因。\n其他對話框、其他 NPC、其他導航目的地一律不碰；隨時可以按「導航」頁的「停止」中止。
