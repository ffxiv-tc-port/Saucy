After arriving from Navigation, talk to the broker and open the ticket panel==從「導航」抵達發放員後，自動對話並開啟購票面板
Exception you turned on: a Navigation trip to the broker talks to them and picks "join" once.==你開啟的例外：用「導航」前往發放員的那一趟，會自動對話並選一次「參加」。
Only runs when you press Go on the Jumbo Cactpot row of the Navigation panel and the walk reaches the broker; logging in, zoning or loading never starts it.\nIt talks to the broker and picks "join" in the broker's menu, once per trip, and stops as soon as the ticket panel opens. This module then fills in the number.\nThe broker's dialog, every purchase confirmation and "buy another?" are handled by YesAlready or by you; Saucy never presses them.\nWhile waiting for the menu it asks YesAlready to pause its SelectString option picking for a few seconds at a time, so the two never pick at the same time; if YesAlready cannot be asked, it leaves the menu to you.\nPressing a movement key while it is still walking up to the broker stops it. Stop it any time with Stop on the Navigation panel.==只在你按下「導航」頁仙人仙彩那一列的「前往」、並走到發放員身邊時才會動作；登入、換區、讀取畫面都不會自己開始。\n只會跟發放員對話，並在發放員的選單選一次「參加仙人仙彩有獎競猜」，購票面板一開就結束；號碼接著由本模組填入。\n發放員的對話、每一張的購買確認與「要不要再買一次？」都要由 YesAlready 或你自己處理，Saucy 不會按。\n等選單出現的期間，會每次請 YesAlready 暫停它的選單選項功能幾秒，免得兩邊同時選；問不到 YesAlready 時，選單交給你自己選。\n還在走向發放員時按下移動鍵就會停止；隨時可以按「導航」頁的「停止」中止。
Paused: you are moving on your own. Picks up again once you stop for ?? seconds.==已暫停：你正在自己移動，停手 ?? 秒後會從目前位置繼續。
Stopped navigation: you kept moving on your own for ?? seconds.==已停止導航：你自己移動超過 ?? 秒，不再自動接續。
Stopped navigation: you left the Gold Saucer.==已停止導航：已離開金碟遊樂園。
Walks there with arrival and failure feedback. If you move on your own while it walks, it pauses and picks up again once you stop; entering combat stops it.==會自動走過去並回報抵達或失敗；走路途中你自行移動時會先暫停，停手後再接續；進入戰鬥會立刻停止。
This Jumbo Cactpot number was not filled in by Saucy (you, or another plugin such as YesAlready's Jumbo Cactpot auto-fill). Saucy counts tickets actually bought, so the next ticket still gets its own number.==這張仙人仙彩的號碼不是 Saucy 填的（你自己填的，或是別的插件，例如 YesAlready 的仙人仙彩自動填號）。Saucy 照實際買了幾張來算，下一張仍會用它自己那一組號碼。
Unchecked (default) = all three tickets use the number set below, same as before.\nChecked = each of the week's three tickets uses its own number; a ticket without "use a specific number" checked rerolls randomly.\n"Which ticket" is how many you have bought this week: the count the server reports when you talk to the broker, plus each purchase seen after that. If that count is unknown, it is the tickets bought since you entered the Gold Saucer this visit.==不勾（預設）＝三張都用下面那一組號碼，跟以前一樣。\n勾起來＝每週三張各自用一組；某一張沒有勾「指定號碼」的話，那張就隨機。\n「第幾張」是本週已經買了幾張：跟發放員對話時伺服器報的張數，加上之後看到的每一次購買。那個張數不知道時，改用這次進金碟遊樂園以來買了幾張。
These three numbers come from the event the server sends when talking to the Jumbo Cactpot broker — the module does not remember them on its own.\nIf you have not talked to them yet, switched characters, or this week's drawing has already passed, it will show "unknown".\nThe module uses how many are already bought to decide which of your three numbers comes next.==這三組號碼來自跟仙人仙彩發放員對話時伺服器送的那筆事件，不是模組自己記的。\n還沒跟他說過話、換了角色、或已經跨過本週開獎都會顯示「未知」。\n模組用「已經買了幾張」來決定下一張用你三組號碼裡的哪一組。
YesAlready also has a Jumbo Cactpot auto-fill; while you talk to the broker, Saucy asks it to pause so the two never fill the same panel.==YesAlready 也有仙人仙彩自動填號；你跟發放員對話的期間，Saucy 會請它暫停，免得兩邊填同一扇面板。
This week's three tickets are already bought; opening the panel again will use random numbers.==本週三張都已經買了；再開購票面板會用隨機號碼。
Stopped walking to the GATE registration NPC: you kept moving on your own for ?? seconds. It starts again after you leave the area and come back.==已停止自動走向 GATE 報名 NPC：你自己移動超過 ?? 秒。離開這一帶再回來會重新開始。
Stopped walking to the Event Coordinator: you kept moving on your own for ?? seconds.==已停止自動走向活動解說員：你自己移動超過 ?? 秒。
Stopped walking to the GATE registration NPC: you kept moving on your own for ?? seconds.==已停止自動走向 GATE 報名 NPC：你自己移動超過 ?? 秒。
Mini Cactpot: paused while you move on your own...==仙人微彩：你正在自己移動，先暫停…
Jumbo Cactpot: paused while you move on your own...==仙人仙彩：你正在自己移動，先暫停…
Only runs when you press Go on the Jumbo Cactpot row of the Navigation panel and the walk reaches the broker; logging in, zoning or loading never starts it.\nIt talks to the broker and picks "join" in the broker's menu, once per trip, and stops as soon as the ticket panel opens. This module then fills in the number.\nThe broker's dialog, every purchase confirmation and "buy another?" are handled by YesAlready or by you; Saucy never presses them.\nWhile waiting for the menu it asks YesAlready to pause its SelectString option picking for a few seconds at a time, so the two never pick at the same time; if YesAlready cannot be asked, it leaves the menu to you.\nIf you move on your own while it is still walking up to the broker, it pauses and walks on once you stop for 2 seconds. Stop it any time with Stop on the Navigation panel.==只在你按下「導航」頁仙人仙彩那一列的「前往」、並走到發放員身邊時才會動作；登入、換區、讀取畫面都不會自己開始。\n只會跟發放員對話，並在發放員的選單選一次「參加仙人仙彩有獎競猜」，購票面板一開就結束；號碼接著由本模組填入。\n發放員的對話、每一張的購買確認與「要不要再買一次？」都要由 YesAlready 或你自己處理，Saucy 不會按。\n等選單出現的期間，會每次請 YesAlready 暫停它的選單選項功能幾秒，免得兩邊同時選；問不到 YesAlready 時，選單交給你自己選。\n還在走向發放員時你自己移動，會先暫停，停手 2 秒後再繼續走；隨時可以按「導航」頁的「停止」中止。
When today's tickets are done, start Questionable's allied society dailies==當天彩券打完後，接著開始 Questionable 的友好部族日常任務
Requires Questionable, with the allied societies you want ticked in Questionable's own settings first; Saucy only asks it to start.\nOnly after a finished ticket's panel closes and today's remaining count is known to be 0 (from the broker's event). If the count is unknown it does not ask.\nAt most once per character per game day (resets at the daily reset). It waits for the broker's closing dialog to end, up to 10 seconds.\nQuestionable decides the rest: if it is already running, or there is nothing to do today, it does not start and says why in its own log.\nOne line in chat either way. Logging in, zoning or loading never starts it.==需要 Questionable，而且要先在 Questionable 的設定裡勾好要做的友好部族；Saucy 只負責請它開始。\n只在打完的那張彩券面板關掉、而且今天剩餘張數確定是 0（來自發放員的事件）時才請它開始；不知道剩幾張就不請。\n每個角色每個遊戲日最多一次（每日重置後才會再請）。會等發放員的道別對話結束，最多等 10 秒。\n其餘由 Questionable 決定：已經在跑、或今天沒有可做的，就不開始，原因寫在它自己的 log。\n不論結果都會在聊天印一行。登入、換區、載入都不會觸發。
Mini Cactpot is done for today; Questionable has started the allied society dailies.==仙人微彩今天打完了，Questionable 已開始友好部族日常任務。
Mini Cactpot is done for today, but Questionable did not start the allied society dailies (see its own message for why).==仙人微彩今天打完了，但 Questionable 這次沒有開始友好部族日常任務（原因見 Questionable 自己的訊息）。
Mini Cactpot is done for today, but Questionable could not be asked to start the allied society dailies (not loaded, or too old).==仙人微彩今天打完了，但呼叫不到 Questionable 的「開始友好部族日常任務」（沒有載入，或版本太舊）。
When you stand next to the broker (however you got there), talk to them and play today's tickets==走到發放員旁站定（不論怎麼到的）就自動對話並玩完今天的彩券
Talks to the broker once you are standing still next to them in the Gold Saucer, however you got there: the Navigation panel, DailyDuty, Lifestream, or on foot.\nIt starts after you have stood still within talking range for about 1 second, once per approach: you must have been more than 10 yalms away (or teleported in) first. Logging in, or turning this on while already standing there, does not start it.\nIt does not start while you are talking, in an event, a menu or combat, or if today's tickets are already known to be used up. If you started talking yourself, it leaves that visit alone.\nIt talks to the broker and picks the join option, nothing more. The broker's dialog and the purchase confirmation (10 MGP a ticket) must be handled by YesAlready or by you; Saucy never presses them.\nWhile picking the join option it asks YesAlready to pause its list selection for a few seconds, so the two never pick at the same time.\nIf you move before the broker answers, it stops; only a Navigation trip walks closer on its own. If no ticket opens within 30 seconds, it stops and says why. Stop it any time with Stop on the Navigation panel.==不論怎麼走到金碟遊樂園的仙人微彩發放員旁（導航、DailyDuty、Lifestream 或自己走），站定後就跟發放員對話。\n在能對話的距離內站定約 1 秒才開始，每次靠近只一次：之前要離開過 10 米外（或傳送過來）。登入時、或打開這個選項時人已經站在旁邊，都不會開始。\n正在對話、事件、選單或戰鬥中，或今天的彩券已知用完時不會開始；你自己先跟發放員說話了，這一次就不插手。\n只負責跟發放員對話並選「參加」。發放員的對話與購票確認（一張 10 金碟幣）由 YesAlready 或你自己處理，Saucy 不按。\n選「參加」時會請 YesAlready 暫停清單選項幾秒，兩邊不會同時選。\n發放員回應前你一移動就停止；只有「導航」那一趟會自己走近。30 秒內沒開出彩券就停止並說明原因。隨時可在導航頁按「停止」。
Mini Cactpot: you are standing next to the broker, so Saucy is talking to them. Move to cancel.==仙人微彩：你站在發放員旁，Saucy 正在跟發放員對話。移動就會取消。
no longer within talking range of the broker==已不在能跟發放員對話的距離內
